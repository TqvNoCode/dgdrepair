<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="laptopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="300" cy="220" r="180" fill="#3B82F6" fill-opacity="0.05" />
  <circle cx="440" cy="180" r="120" fill="#22C55E" fill-opacity="0.04" />

  <!-- Laptop Base Shadow -->
  <ellipse cx="300" cy="385" rx="210" ry="16" fill="#000000" fill-opacity="0.25" />

  <!-- Laptop Display Lid -->
  <rect x="130" y="80" width="340" height="225" rx="14" fill="url(#laptopGrad)" stroke="#374151" stroke-width="2.5" />
  
  <!-- Web Camera & Sensor -->
  <circle cx="300" cy="92" r="3.5" fill="#374151" />
  <circle cx="300" cy="92" r="1.5" fill="#10B981" />

  <!-- Display Screen Inner -->
  <rect x="144" y="104" width="312" height="188" rx="6" fill="url(#screenGrad)" />

  <!-- Screen Content: System Diagnostics Dashboard -->
  <!-- Top Bar -->
  <rect x="144" y="104" width="312" height="24" rx="6" fill="#0D1117" />
  <circle cx="160" cy="116" r="3.5" fill="#EF4444" />
  <circle cx="172" cy="116" r="3.5" fill="#F59E0B" />
  <circle cx="184" cy="116" r="3.5" fill="#10B981" />
  <text x="206" y="120" fill="#9CA3AF" font-family="sans-serif" font-size="9" font-weight="600">GDGRepair Hardware Diagnostic v2.4</text>

  <!-- Metric Card 1: CPU Temp -->
  <rect x="156" y="140" width="88" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="166" y="156" fill="#9CA3AF" font-family="sans-serif" font-size="8">Nhiệt độ CPU</text>
  <text x="166" y="174" fill="#22C55E" font-family="sans-serif" font-size="14" font-weight="700">42°C</text>
  <text x="166" y="186" fill="#6B7280" font-family="sans-serif" font-size="7">Mát mẻ (Đã tra MX-4)</text>

  <!-- Metric Card 2: RAM Status -->
  <rect x="256" y="140" width="88" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="266" y="156" fill="#9CA3AF" font-family="sans-serif" font-size="8">Bộ nhớ RAM</text>
  <text x="266" y="174" fill="#3B82F6" font-family="sans-serif" font-size="14" font-weight="700">16 GB</text>
  <text x="266" y="186" fill="#6B7280" font-family="sans-serif" font-size="7">Dual-Channel 3200MHz</text>

  <!-- Metric Card 3: SSD Health -->
  <rect x="356" y="140" width="88" height="52" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="366" y="156" fill="#9CA3AF" font-family="sans-serif" font-size="8">Ổ cứng SSD</text>
  <text x="366" y="174" fill="#22C55E" font-family="sans-serif" font-size="14" font-weight="700">100%</text>
  <text x="366" y="186" fill="#6B7280" font-family="sans-serif" font-size="7">NVMe M.2 Tốc độ cao</text>

  <!-- System Status Banner -->
  <rect x="156" y="202" width="288" height="42" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <!-- Genuine Windows Checkmark Badge -->
  <circle cx="176" cy="223" r="11" fill="#3B82F6" fill-opacity="0.15" />
  <path d="M172 223L175 226L181 220" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="196" y="219" fill="#F3F4F6" font-family="sans-serif" font-size="10" font-weight="600">Windows 11 Pro - Kích hoạt kỹ thuật số hợp lệ</text>
  <text x="196" y="233" fill="#9CA3AF" font-family="sans-serif" font-size="8">Hệ thống đã cập nhật Driver và tối ưu dịch vụ nền</text>

  <!-- Progress Bar Line -->
  <rect x="156" y="258" width="288" height="5" rx="2.5" fill="#30363D" />
  <rect x="156" y="258" width="240" height="5" rx="2.5" fill="url(#accentBlue)" />
  <text x="156" y="276" fill="#9CA3AF" font-family="sans-serif" font-size="8">Tối ưu hiệu năng: Đạt chuẩn 96/100 điểm</text>

  <!-- Laptop Hinge & Lower Deck Base -->
  <path d="M70 305H530L510 338C506 344 498 348 490 348H110C102 348 94 344 90 338L70 305Z" fill="#1F2937" stroke="#374151" stroke-width="2" />
  <!-- Trackpad indent -->
  <rect x="250" y="318" width="100" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1" />
  <!-- Base front bevel -->
  <line x1="85" y1="347" x2="515" y2="347" stroke="#4B5563" stroke-width="2" />

  <!-- Floating Badge Left: Vệ sinh tản nhiệt -->
  <g transform="translate(40, 150)">
    <rect width="140" height="54" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <circle cx="28" cy="27" r="14" fill="#3B82F6" fill-opacity="0.15" />
    <!-- Fan SVG icon -->
    <path d="M28 20V23M28 31V34M21 27H24M32 27H35" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="27" r="3" fill="#3B82F6"/>
    <text x="50" y="24" fill="#F3F4F6" font-family="sans-serif" font-size="10" font-weight="700">Vệ sinh chuyên sâu</text>
    <text x="50" y="38" fill="#22C55E" font-family="sans-serif" font-size="9" font-weight="600">Giảm 10 - 20°C</text>
  </g>

  <!-- Floating Badge Right: Bản quyền chính hãng -->
  <g transform="translate(430, 260)">
    <rect width="145" height="54" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <circle cx="28" cy="27" r="14" fill="#22C55E" fill-opacity="0.15" />
    <!-- Shield check icon -->
    <path d="M28 19L35 22V27C35 31 28 34 28 34C28 34 21 31 21 27V22L28 19Z" stroke="#22C55E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 27L28 29L31 25" stroke="#22C55E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="24" fill="#F3F4F6" font-family="sans-serif" font-size="10" font-weight="700">An toàn dữ liệu</text>
    <text x="50" y="38" fill="#9CA3AF" font-family="sans-serif" font-size="9">Bảo toàn 100%</text>
  </g>
</svg>
