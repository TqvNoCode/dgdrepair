<section id="contact" class="section-padding contact-section" aria-labelledby="contact-title">
  <div class="container contact-container">
    <div class="section-header">
      <span class="section-badge">Hỗ trợ sinh viên</span>
      <h2 id="contact-title" class="section-title">Đặt lịch dịch vụ</h2>
      <p class="section-subtitle">
        Để lại thông tin thiết bị và nhu cầu của bạn để kỹ thuật viên GDGRepair sắp xếp lịch hỗ trợ nhanh chóng nhất.
      </p>
    </div>

    <!-- Booking Form Card -->
    <div class="contact-form-wrap">
      <form id="booking-form" class="contact-form" novalidate aria-label="Biểu mẫu đặt lịch dịch vụ máy tính">
        <div class="form-grid">
          <!-- Họ và tên -->
          <div class="form-group">
            <label for="booking-fullname" class="form-label">
              Họ và tên <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input 
              type="text" 
              id="booking-fullname" 
              name="fullname" 
              class="form-control" 
              placeholder="Nguyễn Văn A" 
              autocomplete="name" 
              required 
            />
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="booking-email" class="form-label">
              Địa chỉ Email <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input 
              type="email" 
              id="booking-email" 
              name="email" 
              class="form-control" 
              placeholder="sinhvien@dut.udn.vn" 
              autocomplete="email" 
              required 
            />
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>

          <!-- Số điện thoại -->
          <div class="form-group">
            <label for="booking-phone" class="form-label">
              Số điện thoại liên hệ <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input 
              type="tel" 
              id="booking-phone" 
              name="phone" 
              class="form-control" 
              placeholder="0912 345 678" 
              autocomplete="tel" 
              required 
            />
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>

          <!-- Loại thiết bị -->
          <div class="form-group">
            <label for="booking-device-type" class="form-label">
              Loại thiết bị <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <select id="booking-device-type" name="deviceType" class="form-control" required>
              <option value="">-- Chọn loại thiết bị --</option>
              <option value="Laptop Windows (Dell, Asus, Lenovo, HP...)">Laptop Windows (Dell, Asus, Lenovo, HP...)</option>
              <option value="MacBook (Apple macOS)">MacBook (Apple macOS)</option>
              <option value="PC / Máy tính để bàn">PC / Máy tính để bàn</option>
              <option value="Thiết bị khác">Thiết bị khác</option>
            </select>
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>

          <!-- Dịch vụ cần sử dụng -->
          <div class="form-group">
            <label for="booking-service" class="form-label">
              Dịch vụ cần sử dụng <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <select id="booking-service" name="service" class="form-control" required>
              <option value="">-- Chọn dịch vụ --</option>
              <option value="Cài đặt Windows bản quyền">Cài đặt Windows bản quyền</option>
              <option value="Vệ sinh laptop chuyên sâu">Vệ sinh laptop chuyên sâu</option>
              <option value="Nâng cấp RAM & SSD">Nâng cấp RAM & SSD</option>
              <option value="Xử lý lỗi phần mềm & Virus">Xử lý lỗi phần mềm & Virus</option>
              <option value="Kiểm tra & Tư vấn chẩn đoán tổng quát">Kiểm tra & Tư vấn chẩn đoán tổng quát</option>
            </select>
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>

          <!-- Ngày mong muốn -->
          <div class="form-group">
            <label for="booking-date" class="form-label">
              Ngày mong muốn hỗ trợ <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input 
              type="date" 
              id="booking-date" 
              name="bookingDate" 
              class="form-control" 
              required 
            />
            <span class="form-field-error is-hidden" role="alert"></span>
          </div>
        </div>

        <!-- Mô tả tình trạng máy -->
        <div class="form-group form-group-full">
          <label for="booking-notes" class="form-label">
            Mô tả tình trạng thiết bị / Ghi chú thêm
          </label>
          <textarea 
            id="booking-notes" 
            name="notes" 
            class="form-control form-textarea" 
            rows="4" 
            placeholder="Ví dụ: Máy bị nóng khi chạy AutoCAD, thường xuyên bị màn hình xanh, muốn nâng thêm thanh RAM 8GB..."
          ></textarea>
        </div>

        <!-- Form Status Announcement Banner -->
        <div id="booking-status-banner" class="status-banner" role="status" aria-live="polite"></div>

        <!-- Submit Button -->
        <div class="form-submit-wrap">
          <button type="submit" id="booking-submit-btn" class="btn btn-primary btn-lg btn-submit">
            <span class="btn-text">Xác nhận gửi thông tin đặt lịch</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
