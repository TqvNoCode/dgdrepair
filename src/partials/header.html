<header id="navbar" class="site-header" role="banner">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a href="#hero" class="brand-logo" aria-label="GDGRepair Trang chủ">
      <div class="logo-icon-wrap" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40" fill="none">
          <rect width="48" height="48" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
          <!-- Left bracket < (Red top, Blue bottom) -->
          <path d="M16 16L10 24" stroke="#EA4335" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 24L16 32" stroke="#4285F4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Right bracket > (Yellow bottom, Green top) -->
          <path d="M38 24L32 32" stroke="#FBBC04" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M32 16L38 24" stroke="#0F9D58" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="24" cy="24" r="3.5" fill="#4285F4" />
          <path d="M24 14V17M24 31V34M14 24H17M31 24H34" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">GDGRepair</span>
        <span class="brand-subtitle">GDG on Campus - DUT</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <ul class="nav-list">
        <li><a href="#hero" class="nav-link">Trang chủ</a></li>
        <li><a href="#services" class="nav-link">Dịch vụ</a></li>
        <li><a href="#pricing" class="nav-link">Bảng giá</a></li>

        <li><a href="#contact" class="nav-link">Liên hệ</a></li>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Wishlist Action -->
      <a href="#services" class="action-btn wishlist-nav-btn" data-action="goto-wishlist" title="Dịch vụ yêu thích" aria-label="Dịch vụ yêu thích">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <span class="badge-count is-hidden" data-wishlist-count aria-label="Số lượng yêu thích">0</span>
      </a>

      <!-- Theme Toggle -->
      <button type="button" class="action-btn theme-toggle-btn" data-action="toggle-theme" aria-label="Chuyển sang giao diện Sáng" title="Chuyển sang giao diện Sáng">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>

          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- CTA Button -->
      <a href="#contact" class="btn btn-primary btn-sm cta-header-btn">
        Đặt lịch ngay

      <!-- Mobile Hamburger Toggle -->
      <button type="button" id="drawer-toggle" class="hamburger-btn" aria-label="Mở menu" aria-expanded="false" aria-controls="mobile-drawer">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
